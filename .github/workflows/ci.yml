name: CI

# Quality gate on every push to main and every PR: lint, unit tests, production
# build. Mirrors the local verification the pipeline's agents run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        # The app reads real config at runtime; the build only needs these present
        # so nothing throws while Next collects route metadata. They are NOT real
        # credentials — never put production secrets in CI plaintext.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: placeholder-key
          CRON_SECRET: ci-placeholder
